<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Client Portal | VECTUZ</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="vectuz-upgrade.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  .portal-shell{max-width:760px;margin:0 auto;padding:6rem 1.5rem 4rem}
  .portal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2.5rem}
  .portal-greeting{font-family:var(--font-display);font-size:1.6rem;font-weight:800}
  .portal-greeting span{color:var(--green)}
  .logout-btn{background:none;border:1px solid var(--border);color:var(--muted);
    padding:.55rem 1.1rem;border-radius:8px;cursor:pointer;font-size:.82rem;transition:all .3s var(--ease-ios)}
  .logout-btn:hover{border-color:var(--red);color:var(--red)}

  .order-card{background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:1.6rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
  .order-pkg{font-family:var(--font-display);font-weight:700;text-transform:capitalize}
  .order-amount{color:var(--muted);font-size:.88rem;margin-top:.2rem}
  .order-code{color:var(--muted);font-size:.78rem;margin-top:.3rem}
  .order-status{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:.35rem .8rem;border-radius:100px}
  .status-pending_verification{background:rgba(245,200,66,.12);color:var(--gold)}
  .status-confirmed{background:rgba(0,232,122,.12);color:var(--green)}
  .status-rejected{background:rgba(232,68,68,.12);color:var(--red)}

  .pay-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem;margin-top:2rem}
  .pay-panel h3{font-family:var(--font-display);margin-bottom:.5rem}
  .pay-instructions{background:var(--dark);border:1px solid var(--border);border-radius:12px;
    padding:1.2rem;margin:1rem 0 1.5rem;font-size:.9rem;color:var(--muted);line-height:1.7}
  .pay-instructions strong{color:var(--white)}
  .pay-row{display:flex;gap:.8rem;flex-wrap:wrap}
  .pay-row select,.pay-row input{background:var(--dark);border:1px solid var(--border);color:var(--white);
    padding:.85rem 1rem;border-radius:8px;font-size:.9rem;flex:1;min-width:160px}
  .pay-btn{background:var(--green);color:#090b0e;font-family:var(--font-display);font-weight:800;
    padding:.85rem 1.6rem;border:none;border-radius:8px;cursor:pointer;margin-top:1rem;transition:transform .35s var(--ease-ios-bounce)}
  .pay-btn:active{transform:scale(.97)}
  .pay-btn[disabled]{opacity:.5;cursor:not-allowed}
  .pay-status{margin-top:1rem;font-size:.88rem;color:var(--muted)}
  .empty-state{color:var(--muted);font-size:.9rem;text-align:center;padding:2rem 0}
</style>
</head>
<body>

<!-- ══ POST-LOGIN 3D WELCOME BURST — plays once, then fades out ══ -->
<div class="welcome-burst-overlay" id="welcome-burst">
  <div class="welcome-cube-scene" id="welcome-cube-scene"></div>
  <div class="welcome-title">Welcome back, <span id="welcome-name">there</span></div>
</div>

<div class="portal-shell">
  <div class="portal-header ios-reveal in-view">
    <div class="portal-greeting">Hi, <span id="greeting-name">there</span></div>
    <button class="logout-btn ios-press" id="logout-btn">Log Out</button>
  </div>

  <div id="orders-list"></div>

  <div class="pay-panel ios-reveal in-view">
    <h3>Start / Pay for a Project</h3>
    <div class="pay-instructions">
      1. Send payment via M-Pesa to <strong>Till Number: [YOUR TILL NUMBER]</strong> for the package amount below.<br/>
      2. You'll get an M-Pesa confirmation SMS with a code (e.g. <strong>QAB1C2D3E4</strong>).<br/>
      3. Enter that code below so we can verify and confirm your order.
    </div>
    <div class="pay-row">
      <select id="package-select">
        <option value="starter">Starter — KES 24,599</option>
        <option value="business">Business — KES 74,999</option>
        <option value="premium">Premium — KES 120,000</option>
        <option value="max">MAX — KES 200,000</option>
      </select>
      <input id="mpesa-code" type="text" placeholder="M-Pesa confirmation code" required/>
    </div>
    <button class="pay-btn ios-press" id="submit-order-btn">Submit for Verification</button>
    <p class="pay-status" id="pay-status"></p>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'
import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'
import {
  getFirestore, doc, getDoc, collection, addDoc, query, where, orderBy,
  onSnapshot, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js'

// ── Same values as auth.html ──
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
}

const app = initializeApp(firebaseConfig)
const auth = getAuth(app)
const db = getFirestore(app)

const PACKAGE_AMOUNTS = { starter: 24599, business: 74999, premium: 120000, max: 200000 }
let currentUser = null

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'auth.html'; return }
  currentUser = user

  const profileSnap = await getDoc(doc(db, 'profiles', user.uid))
  const profile = profileSnap.exists() ? profileSnap.data() : null
  const displayName = (profile && profile.full_name) || user.displayName || user.email || 'there'
  document.getElementById('greeting-name').textContent = displayName
  document.getElementById('welcome-name').textContent = displayName

  playWelcomeBurst()
  listenToOrders(user.uid)
})

document.getElementById('logout-btn').addEventListener('click', async () => {
  await signOut(auth)
  window.location.href = 'auth.html'
})

function listenToOrders(uid) {
  const list = document.getElementById('orders-list')
  const q = query(collection(db, 'orders'), where('user_id', '==', uid), orderBy('created_at', 'desc'))

  onSnapshot(q, (snap) => {
    if (snap.empty) {
      list.innerHTML = '<div class="empty-state">No projects yet — start one below.</div>'
      return
    }
    list.innerHTML = snap.docs.map(d => {
      const o = d.data()
      return `
        <div class="order-card ios-reveal in-view">
          <div>
            <div class="order-pkg">${o.package}</div>
            <div class="order-amount">KES ${Number(o.amount).toLocaleString()}</div>
            <div class="order-code">M-Pesa code: ${o.mpesa_code || '—'}</div>
          </div>
          <span class="order-status status-${o.status}">${o.status.replace('_', ' ')}</span>
        </div>
      `
    }).join('')
  })
}

document.getElementById('submit-order-btn').addEventListener('click', async () => {
  const pkg = document.getElementById('package-select').value
  const code = document.getElementById('mpesa-code').value.trim().toUpperCase()
  const statusEl = document.getElementById('pay-status')
  const btn = document.getElementById('submit-order-btn')

  if (!code || code.length < 6) {
    statusEl.textContent = 'Enter the M-Pesa confirmation code from your SMS.'
    return
  }

  btn.disabled = true
  statusEl.textContent = 'Submitting for verification…'

  try {
    await addDoc(collection(db, 'orders'), {
      user_id: currentUser.uid,
      package: pkg,
      amount: PACKAGE_AMOUNTS[pkg],
      mpesa_code: code,
      status: 'pending_verification',
      created_at: serverTimestamp()
    })
    statusEl.textContent = "Submitted! We'll verify your payment and confirm your order shortly."
    document.getElementById('mpesa-code').value = ''
  } catch (err) {
    statusEl.textContent = 'Could not submit: ' + err.message
  } finally {
    btn.disabled = false
  }
})

// ── Post-login 3D welcome burst (three.js, VECTUZ green) ──
function playWelcomeBurst() {
  var overlay = document.getElementById('welcome-burst')
  var container = document.getElementById('welcome-cube-scene')
  if (!overlay || !container || typeof THREE === 'undefined') {
    if (overlay) overlay.classList.add('hide')
    return
  }
  var width = container.clientWidth || 150
  var height = container.clientHeight || 150
  var scene = new THREE.Scene()
  var camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100)
  camera.position.set(1.6, 1.3, 2.6)
  camera.lookAt(0, 0, 0)
  var renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true })
  renderer.setSize(width, height)
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2))
  container.appendChild(renderer.domElement)

  var geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5)
  var material = new THREE.MeshStandardMaterial({
    color: 0x00e87a, metalness: 0.4, roughness: 0.25, emissive: 0x00e87a, emissiveIntensity: 0.45
  })
  var cube = new THREE.Mesh(geometry, material)
  scene.add(cube)
  var wireGeo = new THREE.EdgesGeometry(geometry)
  var wireMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 })
  cube.add(new THREE.LineSegments(wireGeo, wireMat))
  scene.add(new THREE.AmbientLight(0xffffff, 0.6))
  var dir = new THREE.DirectionalLight(0xffffff, 1.1)
  dir.position.set(2, 3, 4)
  scene.add(dir)

  var raf
  function animate() {
    cube.rotation.x += 0.02
    cube.rotation.y += 0.03
    renderer.render(scene, camera)
    raf = requestAnimationFrame(animate)
  }
  animate()

  setTimeout(function () {
    overlay.classList.add('hide')
    setTimeout(function () {
      cancelAnimationFrame(raf)
      renderer.dispose()
    }, 700)
  }, 1800)
}
</script>
</body>
</html>
