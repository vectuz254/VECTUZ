<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Client Portal | VECTUZ</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="vectuz-upgrade.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  .portal-shell{max-width:760px;margin:0 auto;padding:6rem 1.5rem 4rem}
  .portal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2.5rem}
  .portal-greeting{font-family:var(--font-display);font-size:1.6rem;font-weight:800}
  .portal-greeting span{color:var(--green)}
  .logout-btn{background:none;border:1px solid var(--border);color:var(--muted);
    padding:.55rem 1.1rem;border-radius:8px;cursor:pointer;font-size:.82rem;transition:all .3s var(--ease-ios)}
  .logout-btn:hover{border-color:var(--red);color:var(--red)}

  .order-card{background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:1.6rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
  .order-pkg{font-family:var(--font-display);font-weight:700;text-transform:capitalize}
  .order-amount{color:var(--muted);font-size:.88rem;margin-top:.2rem}
  .order-status{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:.35rem .8rem;border-radius:100px}
  .status-pending{background:rgba(245,200,66,.12);color:var(--gold)}
  .status-paid{background:rgba(0,232,122,.12);color:var(--green)}
  .status-failed{background:rgba(232,68,68,.12);color:var(--red)}

  .pay-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem;margin-top:2rem}
  .pay-panel h3{font-family:var(--font-display);margin-bottom:1.2rem}
  .pay-row{display:flex;gap:.8rem;flex-wrap:wrap}
  .pay-row select,.pay-row input{background:var(--dark);border:1px solid var(--border);color:var(--white);
    padding:.85rem 1rem;border-radius:8px;font-size:.9rem;flex:1;min-width:160px}
  .pay-btn{background:var(--green);color:#090b0e;font-family:var(--font-display);font-weight:800;
    padding:.85rem 1.6rem;border:none;border-radius:8px;cursor:pointer;margin-top:1rem;transition:transform .35s var(--ease-ios-bounce)}
  .pay-btn:active{transform:scale(.97)}
  .pay-btn[disabled]{opacity:.5;cursor:not-allowed}
  .pay-status{margin-top:1rem;font-size:.88rem;color:var(--muted)}
  .empty-state{color:var(--muted);font-size:.9rem;text-align:center;padding:2rem 0}
</style>
</head>
<body>

<!-- ══ POST-LOGIN 3D WELCOME BURST — plays once, then fades out ══ -->
<div class="welcome-burst-overlay" id="welcome-burst">
  <div class="welcome-cube-scene" id="welcome-cube-scene"></div>
  <div class="welcome-title">Welcome back, <span id="welcome-name">there</span></div>
</div>

<div class="portal-shell">
  <div class="portal-header ios-reveal in-view">
    <div class="portal-greeting">Hi, <span id="greeting-name">there</span></div>
    <button class="logout-btn ios-press" id="logout-btn">Log Out</button>
  </div>

  <div id="orders-list"></div>

  <div class="pay-panel ios-reveal in-view">
    <h3>Start / Pay for a Project</h3>
    <div class="pay-row">
      <select id="package-select">
        <option value="starter">Starter — KES 19,999</option>
        <option value="business">Business — KES 59,999</option>
        <option value="premium">Premium — KES 99,999</option>
        <option value="max">MAX — KES 150,000</option>
      </select>
      <input id="phone-input" type="tel" placeholder="M-Pesa phone e.g. 0712345678" required/>
    </div>
    <button class="pay-btn ios-press" id="pay-btn">Pay with M-Pesa</button>
    <p class="pay-status" id="pay-status"></p>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

// ── Same values as auth.html ──
const SUPABASE_URL = 'https://YOUR-PROJECT-REF.supabase.co'
const SUPABASE_ANON_KEY = 'YOUR-ANON-PUBLIC-KEY'
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

const PACKAGE_AMOUNTS = { starter: 19999, business: 59999, premium: 99999, max: 150000 }

let session, userId

// ── Post-login 3D welcome burst (three.js, VECTUZ green) ──
// This is separate from the site's Rubik's Cube loader/animations —
// it only runs here, once, right after a successful login.
function playWelcomeBurst() {
  var overlay = document.getElementById('welcome-burst')
  var container = document.getElementById('welcome-cube-scene')
  if (!overlay || !container || typeof THREE === 'undefined') {
    if (overlay) overlay.classList.add('hide')
    return
  }
  var width = container.clientWidth || 150
  var height = container.clientHeight || 150
  var scene = new THREE.Scene()
  var camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100)
  camera.position.set(1.6, 1.3, 2.6)
  camera.lookAt(0, 0, 0)
  var renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true })
  renderer.setSize(width, height)
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2))
  container.appendChild(renderer.domElement)

  var geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5)
  var material = new THREE.MeshStandardMaterial({
    color: 0x00e87a, metalness: 0.4, roughness: 0.25, emissive: 0x00e87a, emissiveIntensity: 0.45
  })
  var cube = new THREE.Mesh(geometry, material)
  scene.add(cube)
  var wireGeo = new THREE.EdgesGeometry(geometry)
  var wireMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 })
  cube.add(new THREE.LineSegments(wireGeo, wireMat))
  scene.add(new THREE.AmbientLight(0xffffff, 0.6))
  var dir = new THREE.DirectionalLight(0xffffff, 1.1)
  dir.position.set(2, 3, 4)
  scene.add(dir)

  var raf
  function animate() {
    cube.rotation.x += 0.02
    cube.rotation.y += 0.03
    renderer.render(scene, camera)
    raf = requestAnimationFrame(animate)
  }
  animate()

  // Show for ~1.8s, then fade the overlay out and stop rendering
  setTimeout(function () {
    overlay.classList.add('hide')
    setTimeout(function () {
      cancelAnimationFrame(raf)
      renderer.dispose()
    }, 700)
  }, 1800)
}

async function init() {
  const { data } = await supabase.auth.getSession()
  if (!data.session) { window.location.href = 'auth.html'; return }
  session = data.session
  userId = session.user.id

  const { data: profile } = await supabase.from('profiles').select('full_name, email').eq('id', userId).single()
  const displayName = (profile && profile.full_name) || (profile && profile.email) || 'there'
  document.getElementById('greeting-name').textContent = displayName
  document.getElementById('welcome-name').textContent = displayName

  playWelcomeBurst()
  await loadOrders()
}

async function loadOrders() {
  const list = document.getElementById('orders-list')
  const { data: orders, error } = await supabase
    .from('orders').select('*').eq('user_id', userId).order('created_at', { ascending: false })

  if (error || !orders || orders.length === 0) {
    list.innerHTML = '<div class="empty-state">No projects yet — start one below.</div>'
    return
  }

  list.innerHTML = orders.map(o => `
    <div class="order-card ios-reveal in-view">
      <div>
        <div class="order-pkg">${o.package}</div>
        <div class="order-amount">KES ${Number(o.amount).toLocaleString()}</div>
      </div>
      <span class="order-status status-${o.status}">${o.status}</span>
    </div>
  `).join('')
}

document.getElementById('logout-btn').addEventListener('click', async () => {
  await supabase.auth.signOut()
  window.location.href = 'auth.html'
})

document.getElementById('pay-btn').addEventListener('click', async () => {
  const pkg = document.getElementById('package-select').value
  const phoneRaw = document.getElementById('phone-input').value.trim()
  const statusEl = document.getElementById('pay-status')
  const btn = document.getElementById('pay-btn')

  if (!/^0\d{9}$/.test(phoneRaw) && !/^254\d{9}$/.test(phoneRaw)) {
    statusEl.textContent = 'Enter a valid Safaricom number, e.g. 0712345678'
    return
  }
  const phone = phoneRaw.startsWith('0') ? '254' + phoneRaw.slice(1) : phoneRaw
  const amount = PACKAGE_AMOUNTS[pkg]

  btn.disabled = true
  statusEl.textContent = 'Creating order…'

  // 1. Create a pending order row
  const { data: order, error: orderErr } = await supabase
    .from('orders')
    .insert({ user_id: userId, package: pkg, amount, phone, status: 'pending' })
    .select().single()

  if (orderErr) {
    statusEl.textContent = 'Could not create order: ' + orderErr.message
    btn.disabled = false
    return
  }

  // 2. Trigger the STK push via the Edge Function (holds Daraja secrets server-side)
  statusEl.textContent = 'Sending M-Pesa prompt to your phone…'
  const { data: fnData, error: fnErr } = await supabase.functions.invoke('daraja-checkout', {
    body: { order_id: order.id, phone, amount }
  })

  if (fnErr) {
    statusEl.textContent = 'Payment request failed: ' + fnErr.message
    btn.disabled = false
    return
  }

  statusEl.textContent = 'Check your phone and enter your M-Pesa PIN. This page will update once payment is confirmed.'
  pollOrderStatus(order.id, statusEl, btn)
})

function pollOrderStatus(orderId, statusEl, btn) {
  let attempts = 0
  const interval = setInterval(async () => {
    attempts++
    const { data: o } = await supabase.from('orders').select('status').eq('id', orderId).single()
    if (o && o.status !== 'pending') {
      clearInterval(interval)
      statusEl.textContent = o.status === 'paid' ? '✓ Payment received. Thank you!' : 'Payment was not completed. You can try again.'
      btn.disabled = false
      loadOrders()
    }
    if (attempts > 30) { clearInterval(interval); btn.disabled = false } // stop after ~90s
  }, 3000)
}

init()
</script>
</body>
</html>
